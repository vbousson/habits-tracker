name: Bug report
description: Something behaves differently from what it should.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Please do not paste any personal health data.** Screenshots of your own
        journal, exports of your sheet and the contents of your `Entries` tab are
        not needed to fix a bug — a metric id and a field type are enough. If a
        bug can only be explained with real data, email the maintainer instead
        (see [SECURITY.md](../blob/main/SECURITY.md)).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, as precisely as you can.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps someone else can follow from a fresh install.
      placeholder: |
        1. Open the app with the local demo backend
        2. Go to "Aujourd'hui"
        3. Answer "Crise d'urticaire" with Oui
        4. …
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Backend in use
      options:
        - Local (démo, données dans le navigateur)
        - Google Sheets
        - Both / not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: "Firefox 141 on Android 15 / Safari 18 on iOS 18 / Chrome 130 on Windows 11"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How are you running it
      options:
        - The hosted demo (github.io)
        - My own deployment
        - Locally with npm run dev
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: >-
        Open the developer tools (F12), reproduce the bug, and paste anything red
        from the Console and any failed request from the Network tab. Redact
        spreadsheet ids and access tokens.
      render: text

  - type: textarea
    id: config
    attributes:
      label: Relevant Config rows
      description: >-
        Optional, but usually decisive for form-engine bugs. Paste the `Config`
        rows involved — id, type, options, schedule, mode, depends_on. Rename the
        labels if they are personal.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I have not included any personal health data.
          required: true
