      Setup help, "how do I configure X", or an idea that is not yet a concrete
      feature request. Discussions are the right place for anything open-ended.

  - name: Setting up your Google Sheet
    url: https://github.com/vbousson/habits-tracker/blob/main/docs/GOOGLE_SETUP.md
    about: Step-by-step guide to the Google Cloud project, the OAuth client and your spreadsheet.

  - name: Deployment problems
    url: https://github.com/vbousson/habits-tracker/blob/main/docs/DEPLOYMENT.md
