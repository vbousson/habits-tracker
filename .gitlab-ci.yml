# GitHub Pages is the primary deployment target for this project — see
# .github/workflows/deploy.yml and docs/DEPLOYMENT.md. This file exists so the
# repository can be mirrored to, or hosted on, GitLab without any change to the
# source: same build, same BASE_PATH trick, same SPA fallback.

default:
  image: node:20-alpine
  # `npm ci` is fully determined by package-lock.json, so the cache is a pure
  # speed-up and never changes the result.
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

stages:
  - check
  - deploy

check:
  stage: check
  script:
    - npm run lint
    - npm run typecheck
    - npm run test
    - npm run build
  artifacts:
    when: on_failure
    expire_in: 1 week

pages:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    # Set this as a masked CI/CD variable in Settings > CI/CD > Variables if you
    # want the Google client id baked in. Without it the build still succeeds and
    # the app asks for a client id in its Settings screen.
    VITE_GOOGLE_CLIENT_ID: $VITE_GOOGLE_CLIENT_ID
  script:
    # The site lives under a project sub-path (https://<group>.gitlab.io/<project>/),
    # so every asset URL needs that prefix. Derived from CI_PAGES_URL so it is
    # also correct for a user/group Pages site served from the domain root.
    - BASE_PATH="$(printf '%s' "$CI_PAGES_URL" | sed -E 's#^https?://[^/]+##')"
    - case "$BASE_PATH" in */) ;; *) BASE_PATH="$BASE_PATH/" ;; esac
    - export BASE_PATH
    - echo "Building with BASE_PATH=$BASE_PATH"
    - npm run build
    # GitLab Pages, like GitHub Pages, has no SPA rewrite: without this copy a
    # refresh on any route other than the root returns a 404.
    - cp dist/index.html dist/404.html
    # GitLab Pages publishes the `public/` directory, which is also Vite's static
    # asset folder in this repo — so the built output has to take its place.
    # (On GitLab 17.9+ you can instead drop these two lines and declare
    # `pages: publish: dist` below.)
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
